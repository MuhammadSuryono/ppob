<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISI PULSA - PPOB Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <!-- 1. HEADER -->
    <header class="bg-white border-b sticky top-0 z-10 px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button class="text-gray-600 hover:text-blue-600 transition-colors">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>
            <h1 class="text-lg font-bold text-gray-800 tracking-wide uppercase">ISI PULSA</h1>
        </div>
        <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 border border-blue-200">
            <i class="fa-solid fa-user text-sm"></i>
        </div>
    </header>

    <main class="flex-grow p-4 space-y-6">
        <!-- 2. FORM INPUT & AUTO-DETECT -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <label for="phone" class="block text-sm font-semibold text-gray-500 mb-2 uppercase tracking-tight">Nomor Handphone</label>
            <div class="relative group">
                <input type="tel" id="phone" placeholder="081..."
                    class="w-full text-xl font-bold text-gray-800 placeholder-gray-300 border-b-2 border-gray-100 py-3 focus:outline-none focus:border-blue-500 transition-all bg-transparent"
                    oninput="handleInput(this.value)">
                <div id="operator-logo" class="absolute right-0 top-1/2 -translate-y-1/2 opacity-0 transform scale-75 transition-all duration-300 pointer-events-none">
                    <div class="flex items-center gap-2 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100">
                        <img id="op-img" src="" alt="" class="h-5 w-auto">
                        <span id="op-name" class="text-[10px] font-extrabold text-blue-600 uppercase"></span>
                    </div>
                </div>
            </div>
            <p class="text-[10px] text-gray-400 mt-2">Masukkan nomor tujuan untuk mendeteksi operator otomatis.</p>
        </section>

        <!-- 3. DAFTAR PRODUK (DENOM PULSA) -->
        <section id="denom-section" class="space-y-4">
            <h2 class="text-sm font-extrabold text-gray-800 uppercase tracking-widest px-1">DENOM PULSA</h2>
            <div class="grid grid-cols-2 gap-4">
                <!-- Denom Cards -->
                <div class="denom-card bg-white rounded-2xl p-4 border-2 border-transparent shadow-sm hover:shadow-md transition-all cursor-pointer relative overflow-hidden group" onclick="selectCard(this)">
                    <div class="absolute top-2 right-2 bg-green-500 text-white rounded-full w-5 h-5 flex items-center justify-center scale-0 transition-transform check-mark">
                        <i class="fa-solid fa-check text-[10px]"></i>
                    </div>
                    <span class="text-[10px] font-bold text-blue-400 uppercase">PULSA</span>
                    <div class="text-xl font-black text-gray-800 my-1">5.000</div>
                    <div class="text-[11px] font-semibold text-gray-500">Harga: <span class="text-blue-600">Rp 5.250</span></div>
                </div>

                <div class="denom-card bg-white rounded-2xl p-4 border-2 border-transparent shadow-sm hover:shadow-md transition-all cursor-pointer relative overflow-hidden group" onclick="selectCard(this)">
                    <div class="absolute -top-1 -right-8 bg-orange-500 text-white text-[9px] font-bold px-8 py-1 rotate-45 shadow-sm">PROMO</div>
                    <div class="absolute top-2 right-2 bg-green-500 text-white rounded-full w-5 h-5 flex items-center justify-center scale-0 transition-transform check-mark">
                        <i class="fa-solid fa-check text-[10px]"></i>
                    </div>
                    <span class="text-[10px] font-bold text-blue-400 uppercase">PULSA</span>
                    <div class="text-xl font-black text-gray-800 my-1">10.000</div>
                    <div class="text-[11px] font-semibold text-gray-500">Harga: <span class="text-blue-600">Rp 10.150</span></div>
                </div>

                <div class="denom-card bg-white rounded-2xl p-4 border-2 border-transparent shadow-sm hover:shadow-md transition-all cursor-pointer relative overflow-hidden group" onclick="selectCard(this)">
                    <div class="absolute top-2 right-2 bg-green-500 text-white rounded-full w-5 h-5 flex items-center justify-center scale-0 transition-transform check-mark">
                        <i class="fa-solid fa-check text-[10px]"></i>
                    </div>
                    <span class="text-[10px] font-bold text-blue-400 uppercase">PULSA</span>
                    <div class="text-xl font-black text-gray-800 my-1">25.000</div>
                    <div class="text-[11px] font-semibold text-gray-500">Harga: <span class="text-blue-600">Rp 24.800</span></div>
                </div>

                <div class="denom-card bg-white rounded-2xl p-4 border-2 border-transparent shadow-sm hover:shadow-md transition-all cursor-pointer relative overflow-hidden group" onclick="selectCard(this)">
                    <div class="absolute -top-1 -right-8 bg-orange-500 text-white text-[9px] font-bold px-8 py-1 rotate-45 shadow-sm">PROMO</div>
                    <div class="absolute top-2 right-2 bg-green-500 text-white rounded-full w-5 h-5 flex items-center justify-center scale-0 transition-transform check-mark">
                        <i class="fa-solid fa-check text-[10px]"></i>
                    </div>
                    <span class="text-[10px] font-bold text-blue-400 uppercase">PULSA</span>
                    <div class="text-xl font-black text-gray-800 my-1">50.000</div>
                    <div class="text-[11px] font-semibold text-gray-500">Harga: <span class="text-blue-600">Rp 49.500</span></div>
                </div>

                <div class="denom-card bg-white rounded-2xl p-4 border-2 border-transparent shadow-sm hover:shadow-md transition-all cursor-pointer relative overflow-hidden group" onclick="selectCard(this)">
                    <div class="absolute top-2 right-2 bg-green-500 text-white rounded-full w-5 h-5 flex items-center justify-center scale-0 transition-transform check-mark">
                        <i class="fa-solid fa-check text-[10px]"></i>
                    </div>
                    <span class="text-[10px] font-bold text-blue-400 uppercase">PULSA</span>
                    <div class="text-xl font-black text-gray-800 my-1">100.000</div>
                    <div class="text-[11px] font-semibold text-gray-500">Harga: <span class="text-blue-600">Rp 98.200</span></div>
                </div>

                <div class="denom-card bg-white rounded-2xl p-4 border-2 border-transparent shadow-sm hover:shadow-md transition-all cursor-pointer relative overflow-hidden group" onclick="selectCard(this)">
                    <div class="absolute top-2 right-2 bg-green-500 text-white rounded-full w-5 h-5 flex items-center justify-center scale-0 transition-transform check-mark">
                        <i class="fa-solid fa-check text-[10px]"></i>
                    </div>
                    <span class="text-[10px] font-bold text-blue-400 uppercase">PULSA</span>
                    <div class="text-xl font-black text-gray-800 my-1">150.000</div>
                    <div class="text-[11px] font-semibold text-gray-500">Harga: <span class="text-blue-600">Rp 148.500</span></div>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER CTA -->
    <div id="cta-button" class="fixed bottom-20 left-0 right-0 p-4 transform translate-y-32 transition-transform duration-300">
        <button class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-95 transition-all uppercase tracking-widest text-sm">
            Lanjut Pembayaran
        </button>
    </div>

    <!-- 1. BOTTOM NAVIGATION -->
    <nav class="bg-white border-t py-3 px-8 flex justify-between items-center sticky bottom-0 z-10">
        <div class="flex flex-col items-center gap-1 text-blue-600">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Beranda</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-gray-400 hover:text-blue-400 transition-colors cursor-pointer">
            <i class="fa-solid fa-receipt text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Riwayat</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-gray-400 hover:text-blue-400 transition-colors cursor-pointer">
            <i class="fa-solid fa-user-gear text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Profil</span>
        </div>
    </nav>

    <script>
        function handleInput(val) {
            const logoDiv = document.getElementById('operator-logo');
            const opName = document.getElementById('op-name');
            const opImg = document.getElementById('op-img');

            if (val.length >= 4) {
                const prefix = val.substring(0, 4);
                let operator = '';
                let imgUrl = '';

                if (['0811', '0812', '0813', '0821', '0822', '0852'].includes(prefix)) {
                    operator = 'Telkomsel';
                    imgUrl = 'https://upload.wikimedia.org/wikipedia/commons/b/bc/Telkomsel_2021_logo.svg';
                } else if (['0817', '0818', '0819', '0859', '0877', '0878'].includes(prefix)) {
                    operator = 'XL Axiata';
                    imgUrl = 'https://upload.wikimedia.org/wikipedia/en/5/55/XL_Axiata_logo_2016.svg';
                } else if (['0814', '0815', '0816', '0855', '0856', '0857', '0858'].includes(prefix)) {
                    operator = 'Indosat';
                    imgUrl = 'https://upload.wikimedia.org/wikipedia/commons/a/a2/Logo_Indosat_Ooredoo_Hutchison.svg';
                } else {
                    operator = 'Dideteksi...';
                    imgUrl = 'https://www.svgrepo.com/show/509271/telecom.svg';
                }

                opName.innerText = operator;
                opImg.src = imgUrl;
                logoDiv.classList.remove('opacity-0', 'scale-75');
                logoDiv.classList.add('opacity-100', 'scale-100');
            } else {
                logoDiv.classList.add('opacity-0', 'scale-75');
                logoDiv.classList.remove('opacity-100', 'scale-100');
            }
        }

        function selectCard(el) {
            document.querySelectorAll('.denom-card').forEach(card => {
                card.classList.remove('border-blue-500', 'bg-blue-50/30');
                card.querySelector('.check-mark').classList.remove('scale-100');
                card.querySelector('.check-mark').classList.add('scale-0');
            });

            el.classList.add('border-blue-500', 'bg-blue-50/30');
            el.querySelector('.check-mark').classList.remove('scale-0');
            el.querySelector('.check-mark').classList.add('scale-100');

            const cta = document.getElementById('cta-button');
            cta.classList.remove('translate-y-32');
            cta.classList.add('translate-y-0');
        }
    </script>
</body>
</html>
