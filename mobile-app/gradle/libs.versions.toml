[versions]
# Build
agp = "8.5.2"
kotlin = "2.1.21"
ksp = "2.1.21-2.0.1"

# AndroidX Core
coreKtx = "1.15.0"
activityCompose = "1.10.1"

# Lifecycle
lifecycle = "2.8.7"

# Compose
composeBom = "2025.05.01"
navigationCompose = "2.8.9"

# Dependency Injection
hilt = "2.56.2"
hiltNavigationCompose = "1.2.0"

# Database
room = "2.7.0"
datastore = "1.1.3"

# WorkManager
work = "2.10.1"

# Networking
retrofit = "2.11.0"
okhttp = "4.12.0"

# Serialization
moshi = "1.15.2"

# Image Loading
coil = "3.1.0"

# Pagination
paging = "3.3.6"

# Security
biometric = "1.1.0"
securityCrypto = "1.1.0"

# Firebase
firebaseBom = "34.0.0"

# Debugging
leakcanary = "2.14"
timber = "5.0.1"
chucker = "4.1.0"

# Splashscreen
splashscreen = "1.0.1"

# Testing
junit = "4.13.2"
androidxJunit = "1.2.1"
espressoCore = "3.6.1"
mockk = "1.13.11"
turbine = "1.2.0"

# Coroutines
coroutines = "1.8.1"

[libraries]

# =========================
# Kotlin
# =========================
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# =========================
# AndroidX Core
# =========================
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# =========================
# Lifecycle
# =========================
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }

# =========================
# Activity Compose
# =========================
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# =========================
# Compose BOM
# =========================
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

# =========================
# Compose UI
# =========================
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }

androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }

androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }

# =========================
# Material
# =========================
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# =========================
# Navigation
# =========================
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# =========================
# Hilt
# =========================
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }

hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# =========================
# Room
# =========================
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }

androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# =========================
# DataStore
# =========================
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# =========================
# WorkManager
# =========================
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# =========================
# Retrofit
# =========================
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }

retrofit-converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }

# =========================
# OkHttp
# =========================
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# =========================
# Moshi
# =========================
moshi = { group = "com.squareup.moshi", name = "moshi", version.ref = "moshi" }

moshi-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }

# =========================
# Coil
# =========================
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }

# =========================
# Paging
# =========================
androidx-paging-runtime-ktx = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging" }

androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

# =========================
# Biometric
# =========================
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# =========================
# Firebase
# =========================
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }

firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }

firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }

# =========================
# Security
# =========================
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# =========================
# Logging
# =========================
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# =========================
# Chucker
# =========================
chucker-debug = { group = "com.github.chuckerteam.chucker", name = "library", version.ref = "chucker" }

chucker-release = { group = "com.github.chuckerteam.chucker", name = "library-no-op", version.ref = "chucker" }

# =========================
# LeakCanary
# =========================
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

# =========================
# Testing
# =========================
junit = { group = "junit", name = "junit", version.ref = "junit" }

androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }

androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

google-services = { id = "com.google.gms.google-services", version = "4.4.2" }
