services:
    transaction-service:
        build:
            context: ..
            dockerfile: transaction-service/Dockerfile
        container_name: ppob-transaction-service
        ports:
            - "8084:8080"
        environment:
            - SERVER_PORT=8080
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_USER=postgres
            - DB_PASSWORD=${POSTGRES_PASSWORD:-ppob_secure_password_2024}
            - DB_NAME=ppob
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - GIN_MODE=debug
            - WALLET_GRPC_ADDR=ppob-wallet-service:50083
            - PRODUCT_GRPC_ADDR=ppob-product-service:50085
            - INTEGRATION_GRPC_ADDR=ppob-integration-service:50086
        volumes:
            - ../auth-service/certs:/app/certs
        networks:
            - deployment_deployment_deployment_ppob-internal
        restart: unless-stopped

networks:
    deployment_deployment_deployment_ppob-internal:
        external: true
