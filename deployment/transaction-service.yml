version: "3.8"

services:
  transaction-service:
    build:
      context: ../transaction-service
      dockerfile: Dockerfile
    container_name: ppob-transaction-service
    ports:
      - "8084:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=ppob
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GIN_MODE=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - deployment_deployment_ppob-internal
    restart: unless-stopped

networks:
  deployment_deployment_ppob-internal:
    external: true