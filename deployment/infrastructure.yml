services:
    # PostgreSQL Database
    postgres:
        image: postgres:15-alpine
        container_name: ppob-postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppob_secure_password_2024}
            POSTGRES_DB: ppob
        ports:
            - "5432:5432" # Exposed for local access, restricted via pg_hba.conf
        volumes:
            # Volume untuk data cluster
            - postgres_data:/var/lib/postgresql/data
            # Mount config ke folder terpisah
            - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
            - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
        command:
            ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
        networks:
            - deployment_deployment_ppob-internal
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Database Migration
    db-migration:
        image: gomicro/goose:latest
        container_name: ppob-db-migration
        volumes:
            - ../migrations:/migrations
        environment:
            - GOOSE_DRIVER=postgres
            - GOOSE_DBSTRING=host=postgres port=5432 user=postgres password=${POSTGRES_PASSWORD:-ppob_secure_password_2024} dbname=ppob sslmode=disable
        command: ["goose", "-dir", "/migrations", "up"]
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - deployment_deployment_ppob-internal

    # Redis
    redis:
        image: redis:7-alpine
        container_name: ppob-redis
        # ports:
        #     - "6379:6379" # Removed public exposure
        volumes:
            - redis_data:/data
        networks:
            - deployment_deployment_ppob-internal
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Jaeger for distributed tracing
    jaeger:
        image: jaegertracing/all-in-one:1.45
        container_name: ppob-jaeger
        # ports:
        #     - "16686:16686" # UI
        #     - "14268:14268"
        #     - "14250:14250"
        environment:
            - COLLECTOR_OTLP_ENABLED=true
        networks:
            - deployment_deployment_ppob-internal

    # Prometheus
    prometheus:
        image: prom/prometheus:latest
        container_name: ppob-prometheus
        # ports:
        #     - "9091:9090"
        volumes:
            - ../prometheus.yml:/etc/prometheus/prometheus.yml
        networks:
            - deployment_deployment_ppob-internal

    # Grafana
    grafana:
        image: grafana/grafana:latest
        container_name: ppob-grafana
        ports:
            - "3000:3000"
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-ppob_admin_secure_2024}
        volumes:
            - grafana_data:/var/lib/grafana
        networks:
            - deployment_deployment_ppob-internal
        depends_on:
            - prometheus

    # API Gateway (Kong)
    kong-database:
        image: postgres:15-alpine
        container_name: ppob-kong-database
        environment:
            - POSTGRES_USER=kong
            - POSTGRES_PASSWORD=kong
            - POSTGRES_DB=kong
        networks:
            - deployment_deployment_ppob-internal
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U kong"]
            interval: 10s
            timeout: 5s
            retries: 5

    kong-migration:
        image: kong:3.4
        container_name: ppob-kong-migration
        command: "kong migrations bootstrap"
        depends_on:
            kong-database:
                condition: service_healthy
        environment:
            - KONG_DATABASE=postgres
            - KONG_PG_HOST=kong-database
            - KONG_PG_USER=kong
            - KONG_PG_PASSWORD=kong
        networks:
            - deployment_deployment_ppob-internal

    kong:
        image: kong:3.4
        container_name: ppob-kong
        ports:
            - "8000:8000" # Proxy HTTP
            - "8443:8443" # Proxy HTTPS
            - "8001:8001" # Admin API HTTP
            - "8444:8444" # Admin API HTTPS
        depends_on:
            kong-migration:
                condition: service_completed_successfully
        environment:
            - KONG_DATABASE=postgres
            - KONG_PG_HOST=kong-database
            - KONG_PG_USER=kong
            - KONG_PG_PASSWORD=kong
            - KONG_PROXY_ACCESS_LOG=/dev/stdout
            - KONG_ADMIN_ACCESS_LOG=/dev/stdout
            - KONG_PROXY_ERROR_LOG=/dev/stderr
            - KONG_ADMIN_ERROR_LOG=/dev/stderr
            - KONG_ADMIN_LISTEN=0.0.0.0:8001, 0.0.0.0:8444 ssl
            - KONG_DECLARATIVE_CONFIG=/etc/kong/kong.yml
        volumes:
            - ./config/kong/kong.yml:/etc/kong/kong.yml
        networks:
            - deployment_deployment_ppob-internal
        restart: unless-stopped

volumes:
    postgres_data:
    redis_data:
    grafana_data:

networks:
    deployment_deployment_ppob-internal:
        driver: bridge
