services:
    integration-service:
        build:
            context: ..
            dockerfile: integration-service/Dockerfile
        container_name: ppob-integration-service
        ports:
            - "8086:8080"
            - "50086:50086"
        environment:
            - SERVER_PORT=8080
            - GRPC_PORT=50086
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_USER=postgres
            - DB_PASSWORD=${POSTGRES_PASSWORD:-ppob_secure_password_2024}
            - DB_NAME=ppob
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - GIN_MODE=debug
            - JaegerEndpoint=http://jaeger:14268/api/traces
            - DigiflazzURL=https://api.digiflazz.com/v1
            - DigiflazzKey=your_digiflazz_key_here
            - DigiflazzSecret=your_digiflazz_secret_here
        volumes:
            - ../auth-service/certs:/app/certs
        networks:
            - deployment_deployment_deployment_ppob-internal
        restart: unless-stopped

networks:
    deployment_deployment_deployment_ppob-internal:
        external: true
