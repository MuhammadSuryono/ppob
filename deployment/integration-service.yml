version: "3.8"

services:
  integration-service:
    build:
      context: ../integration-service
      dockerfile: Dockerfile
    container_name: ppob-integration-service
    ports:
      - "8086:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=ppob
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GIN_MODE=debug
      - JaegerEndpoint=http://jaeger:14268/api/traces
      - DigiflazzURL=https://api.digiflazz.com/v1
      - DigiflazzKey=your_digiflazz_key_here
      - DigiflazzSecret=your_digiflazz_secret_here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - deployment_deployment_ppob-internal
    restart: unless-stopped

networks:
  deployment_deployment_ppob-internal:
    external: true