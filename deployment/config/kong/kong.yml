_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://ppob-auth-service:8080
    routes:
      - name: auth-route
        paths:
          - /api/v1/auth
        strip_path: false

  - name: user-service
    url: http://ppob-user-service:8080
    routes:
      - name: user-route
        paths:
          - /api/v1/users
          - /api/v1/staff
          - /api/v1/roles
          - /api/v1/margin
          - /api/v1/notifications
          - /api/v1/switch-role
        strip_path: false

  - name: wallet-service
    url: http://ppob-wallet-service:8080
    routes:
      - name: wallet-route
        paths:
          - /api/v1/wallets
          - /api/v1/balance
        strip_path: false

  - name: transaction-service
    url: http://ppob-transaction-service:8080
    routes:
      - name: transaction-route
        paths:
          - /api/v1/transactions
          - /api/v1/reports
        strip_path: false
      - name: transaction-webhook-route
        paths:
          - /webhook/digiflazz
        strip_path: false

  - name: product-service
    url: http://ppob-product-service:8080
    routes:
      - name: product-route
        paths:
          - /api/v1/products
          - /api/v1/categories
          - /api/v1/sync
        strip_path: false

  - name: integration-service
    url: http://ppob-integration-service:8080
    routes:
      - name: integration-route
        paths:
          - /api/v1/integrations
        strip_path: false
      - name: integration-webhook-route
        paths:
          - /webhook/integration
        strip_path: false

plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      headers: ["Accept", "Accept-Version", "Content-Length", "Content-MD5", "Content-Type", "Date", "Authorization"]
      exposed_headers: ["X-Auth-Token"]
      credentials: true
      max_age: 3600
