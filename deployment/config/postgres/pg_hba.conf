# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local connections (inside container)
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Allow remote connections from User's Specific IPs
host    all             all             192.168.100.7/32        scram-sha-256
host    all             all             192.168.100.23/32       scram-sha-256

# Allow remote connections from Docker internal network
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256
