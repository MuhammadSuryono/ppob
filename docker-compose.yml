version: "3.8"

services:
    # PostgreSQL Database
    postgres:
        image: postgres:15-alpine
        container_name: ppob-postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppob_secure_password_2024}
            POSTGRES_DB: ppob
        ports:
            - "5432:5432" # Exposed for local access, restricted via pg_hba.conf
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./deployment/config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
            - ./deployment/config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
        command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
        networks:
            - ppob-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Database Migration
    db-migration:
        image: gomicro/goose:latest
        container_name: ppob-db-migration
        volumes:
            - ./migrations:/migrations
        environment:
            - GOOSE_DRIVER=postgres
            - GOOSE_DBSTRING=host=postgres port=5432 user=postgres password=${POSTGRES_PASSWORD:-ppob_secure_password_2024} dbname=ppob sslmode=disable
        command: ["goose", "-dir", "/migrations", "up"]
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - ppob-network

    # Redis
    redis:
        image: redis:7-alpine
        container_name: ppob-redis
        # ports:
        #     - "6379:6379" # Removed public exposure
        volumes:
            - redis_data:/data
        networks:
            - ppob-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Jaeger for distributed tracing
    jaeger:
        image: jaegertracing/all-in-one:1.45
        container_name: ppob-jaeger
        # ports:
        #     - "16686:16686"
        #     - "14268:14268"
        #     - "14250:14250"
        environment:
            - COLLECTOR_OTLP_ENABLED=true
        networks:
            - ppob-network

    # Prometheus
    prometheus:
        image: prom/prometheus:latest
        container_name: ppob-prometheus
        # ports:
        #     - "9090:9090"
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
        networks:
            - ppob-network

    # Grafana
    grafana:
        image: grafana/grafana:latest
        container_name: ppob-grafana
        ports:
            - "3000:3000"
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-ppob_admin_secure_2024}
        volumes:
            - grafana_data:/var/lib/grafana
        networks:
            - ppob-network
        depends_on:
            - prometheus

