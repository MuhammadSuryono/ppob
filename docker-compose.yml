    # API Gateway (Kong)
    kong-database:
        image: postgres:15-alpine
        container_name: ppob-kong-database
        environment:
            - POSTGRES_USER=kong
            - POSTGRES_PASSWORD=kong
            - POSTGRES_DB=kong
        networks:
            - ppob-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U kong"]
            interval: 10s
            timeout: 5s
            retries: 5

    kong-migration:
        image: kong:3.4
        container_name: ppob-kong-migration
        command: "kong migrations bootstrap"
        depends_on:
            kong-database:
                condition: service_healthy
        environment:
            - KONG_DATABASE=postgres
            - KONG_PG_HOST=kong-database
            - KONG_PG_USER=kong
            - KONG_PG_PASSWORD=kong
        networks:
            - ppob-network

    kong:
        image: kong:3.4
        container_name: ppob-kong
        ports:
            - "8000:8000"
            - "8443:8443"
            - "8001:8001"
            - "8444:8444"
        depends_on:
            kong-migration:
                condition: service_completed_successfully
        environment:
            - KONG_DATABASE=postgres
            - KONG_PG_HOST=kong-database
            - KONG_PG_USER=kong
            - KONG_PG_PASSWORD=kong
            - KONG_PROXY_ACCESS_LOG=/dev/stdout
            - KONG_ADMIN_ACCESS_LOG=/dev/stdout
            - KONG_PROXY_ERROR_LOG=/dev/stderr
            - KONG_ADMIN_ERROR_LOG=/dev/stderr
            - KONG_ADMIN_LISTEN=0.0.0.0:8001, 0.0.0.0:8444 ssl
        networks:
            - ppob-network
        restart: unless-stopped

volumes:
    postgres_data:
    redis_data:
    grafana_data:

networks:
    ppob-network:
        driver: bridge
